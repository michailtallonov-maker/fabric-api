name: Ore Vein Miner
on:
  push:
    paths:
      - 'ore-vein-miner/**'
      - '.github/workflows/ore-vein-miner.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ore-vein-miner
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: ore-vein-miner
          path: ore-vein-miner/build/libs/

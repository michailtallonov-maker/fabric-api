name: Tunnel Miner
on:
  push:
    paths:
      - 'tunnel-miner/**'
      - '.github/workflows/tunnel-miner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tunnel-miner
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: tunnel-miner
          path: tunnel-miner/build/libs/
      # Publish the jar as a release so it can be downloaded by a direct link.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: tunnel-miner-latest
          name: Tunnel Miner (Minecraft 26.2)
          body: Client-side 3x3 tunnel mining mod for Fabric, Minecraft 26.2. Put the jar into .minecraft/mods together with Fabric API.
          target_commitish: ${{ github.sha }}
          files: tunnel-miner/build/libs/tunnel-miner-*.jar
          overwrite_files: true

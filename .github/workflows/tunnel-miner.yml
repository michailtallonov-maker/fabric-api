name: Tunnel Miner
on:
  push:
    paths:
      - 'tunnel-miner/**'
      - '.github/workflows/tunnel-miner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      # One at a time, so both jobs don't try to create the release simultaneously.
      max-parallel: 1
      matrix:
        include:
          - minecraft: '26.2'
            fabric_api: '0.161.0+26.2'
          - minecraft: '26.3'
            fabric_api: '0.163.0+26.3'
    defaults:
      run:
        working-directory: tunnel-miner
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./gradlew build --stacktrace -Pminecraft_version=${{ matrix.minecraft }} -Pfabric_api_version=${{ matrix.fabric_api }}
      - uses: actions/upload-artifact@v7
        with:
          name: tunnel-miner-${{ matrix.minecraft }}
          path: tunnel-miner/build/libs/
      # Publish the jar as a release so it can be downloaded by a direct link.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: tunnel-miner-latest
          name: Tunnel Miner (Minecraft 26.2 / 26.3)
          body: Client-side 3x3 tunnel mining mod for Fabric, Minecraft 26.2 and 26.3. Pick the jar matching your Minecraft version and put it into .minecraft/mods together with Fabric API.
          target_commitish: ${{ github.sha }}
          files: tunnel-miner/build/libs/tunnel-miner-*.jar
          overwrite_files: true

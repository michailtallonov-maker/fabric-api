name: Build Custom Crosshair mod
on:
  push:
    paths:
      - 'custom-crosshair/**'
      - '.github/workflows/custom-crosshair.yml'
  workflow_dispatch:
jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: custom-crosshair
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '25'
      - uses: actions/checkout@v6
      - run: chmod +x gradlew && ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: custom-crosshair
          path: custom-crosshair/build/libs/*.jar
      - name: Commit built jar to dist/
        if: github.event_name == 'push'
        run: |
          mkdir -p ../dist
          rm -f ../dist/*.jar
          cp build/libs/*.jar ../dist/
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet || (git commit -m "Update prebuilt custom-crosshair jar" && git push origin HEAD:${GITHUB_REF_NAME})

name: Build Custom Crosshair mod
on:
  push:
    paths:
      - 'custom-crosshair/**'
      - '.github/workflows/custom-crosshair.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: custom-crosshair
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '25'
      - uses: actions/checkout@v6
      - run: chmod +x gradlew && ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: custom-crosshair
          path: custom-crosshair/build/libs/*.jar
      - name: Print jar as base64
        run: |
          for f in build/libs/*.jar; do
            echo "JAR-BEGIN $(basename "$f") $(sha256sum "$f" | cut -d' ' -f1)"
            base64 -w 1000 "$f"
            echo "JAR-END"
          done
